if(S.run){const c=d.c&&comps.find(x=>x.id===d.c);if(c){if(c.k==='sw')c.s.on=c.s.on?0:1;else if(c.k==='pb'||c.k==='pbn'){c.s.on=1;hold=c}}else pan=pn0;return}
if(d.t)wiring={f:d.t,x:p.x,y:p.y};
else if(d.c){sel=d.c;selW=null;const c=comps.find(x=>x.id===d.c);drag={id:d.c,dx:p.x-c.x,dy:p.y-c.y};props()}
else if(d.w!==undefined){selW=+d.w;sel=null;props()}else{sel=null;selW=null;props();pan=pn0}});
addEventListener('pointermove',e=>{if(pan){const r=sv.getBoundingClientRect();V.x=pan.vx-(e.clientX-pan.x)*V.w/r.width;V.y=pan.vy-(e.clientY-pan.y)*V.w/r.width;return}
const p=pt(e);if(drag){const c=comps.find(x=>x.id===drag.id);c.x=sn(p.x-drag.dx);c.y=sn(p.y-drag.dy)}if(wiring){wiring.x=p.x;wiring.y=p.y}});
addEventListener('pointerup',e=>{pan=null;if(hold){hold.s.on=0;hold=null}
if(wiring){const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.dataset&&el.dataset.t;if(t&&t!==wiring.f&&!wires.some(w=>w.includes(wiring.f)&&w.includes(t)))wires.push([wiring.f,t]);wiring=null}drag=null});
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.key==='Delete'||e.key==='Backspace')del();if(e.key==='r'||e.key==='R')rot();if(e.key==='Escape'){sel=null;selW=null;props()}});
$('md').onclick=()=>{S.run=S.run?0:1;wiring=null;drag=null};
$('fb').onclick=()=>{if(!S.fault){S.fault=1;S.tf=0;log('Fault applied: '+S.If+' A')}else{S.fault=0;log('Fault cleared')}};
$('If').oninput=e=>{S.If=+e.target.value;$('ifv').textContent=S.If};$('ifv').textContent=S.If;
function sv2(){try{localStorage.setItem('ocsim',JSON.stringify({comps,wires,idc}));log('Saved to this browser')}catch(e){log('Save not available here')}}
function ld(){try{const d=JSON.parse(localStorage.getItem('ocsim'));comps=d.comps;wires=d.wires;idc=d.idc;prev={};sel=null;log('Loaded');props()}catch(e){log('Nothing saved')}}
let last=performance.now();function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;step(dt);render();requestAnimationFrame(loop)}
ex();props();requestAnimationFrame(()=>{fit();requestAnimationFrame(loop)});
